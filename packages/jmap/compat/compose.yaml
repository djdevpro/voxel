# Banc de compatibilité JMAP (WP8) : lancé par `run.ts` avec `-p voxel-compat`.
# Ports publiés sur 127.0.0.1 seulement, entre 18400 et 18799. Images épinglées par empreinte.
services:
  stalwart:
    image: stalwartlabs/stalwart:v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
    init: true
    ports:
      - "127.0.0.1:18480:8080"
    environment:
      STALWART_RECOVERY_ADMIN: "admin:CompatAdmin-2026"
      STALWART_PUBLIC_URL: "http://127.0.0.1:18480"
    volumes:
      - ./stalwart.json:/etc/stalwart/config.json:ro

  cyrus:
    image: ghcr.io/cyrusimap/cyrus-docker-test-server@sha256:035aa4ffdb84df95a1057645d05c9a156dde74e5787ef1a11f7d9c244a38b2c0
    ports:
      - "127.0.0.1:18580:8080"
      - "127.0.0.1:18501:8001"
    environment:
      JMAPBASEURL: "http://127.0.0.1:18580"
      SKIP_CREATE_USERS: "1"

  james:
    image: apache/james:memory-3.9.1@sha256:093b35e8e11ab63b379799d42cf4a1b095ba43f49da28de5c729c9e848b52e8e
    ports:
      - "127.0.0.1:18680:80"
      - "127.0.0.1:18600:8000"
    volumes:
      - ./james-jmap.properties:/root/conf/jmap.properties:ro
      - ./james-webadmin.properties:/root/conf/webadmin.properties:ro
      - ${VOXEL_COMPAT_STATE}/keystore:/root/conf/keystore:ro

  james-minimal:
    image: apache/james:memory-3.9.1@sha256:093b35e8e11ab63b379799d42cf4a1b095ba43f49da28de5c729c9e848b52e8e
    ports:
      - "127.0.0.1:18780:80"
      - "127.0.0.1:18700:8000"
    volumes:
      - ./james-minimal-jmap.properties:/root/conf/jmap.properties:ro
      - ./james-webadmin.properties:/root/conf/webadmin.properties:ro
      - ${VOXEL_COMPAT_STATE}/keystore:/root/conf/keystore:ro
